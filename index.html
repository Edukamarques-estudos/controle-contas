<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Contas a Pagar</title>
  <style>
    :root {
      /* Tema Claro (Pastel Suave) */
      --bg: #f8f7f4;
      --surface: #ffffff;
      --surface-paid: #fcfbf9;
      --notes-bg: #f5f3ef;
      --notes-text: #5c6573;
      --primary: #7c9cbf;
      --primary-hover: #6788ad;
      --primary-soft: #e6eef7;
      --primary-text: #3d5a7c;
      --success: #4a8b71;
      --success-bg: #e1f3eb;
      --warning: #a67c37;
      --warning-bg: #fcf1d8;
      --warning-border: #f2dfb3;
      --danger: #b85d68;
      --danger-bg: #fae6e8;
      --edit: #6d689e;
      --edit-bg: #ecebfa;
      --text: #3b424c;
      --muted: #7e8794;
      --border: #eae6df;
      --shadow: 0 2px 6px rgba(59, 66, 76, 0.03);
      --radius: 14px;
    }

    /* Tema Escuro (Dark Mode Pastel) */
    body.dark {
      --bg: #16191e;
      --surface: #1f242c;
      --surface-paid: #1a1e25;
      --notes-bg: #262c36;
      --notes-text: #cbd5e1;
      --primary: #8ab0db;
      --primary-hover: #9fc0e6;
      --primary-soft: #253447;
      --primary-text: #a5c7ed;
      --success: #6ec49e;
      --success-bg: #1d362d;
      --warning: #e5b567;
      --warning-bg: #382e1e;
      --warning-border: #4d3f28;
      --danger: #e0828d;
      --danger-bg: #3b2327;
      --edit: #a8a2e6;
      --edit-bg: #29273d;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2e3540;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    /* Cabeçalho */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .sync-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--success-bg);
      color: var(--success);
      font-weight: 600;
    }

    .sync-badge.offline {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* Botões */
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary { background: var(--primary); color: #16191e; }
    body:not(.dark) .btn-primary { color: #ffffff; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-outline { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { filter: brightness(0.95); }
    body.dark .btn-outline:hover { filter: brightness(1.15); }

    .btn-theme {
      padding: 9px 12px;
      font-size: 1rem;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-this-month {
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid var(--warning-border);
      padding: 9px 14px;
    }
    .btn-this-month:hover { filter: brightness(0.96); }
    body.dark .btn-this-month:hover { filter: brightness(1.12); }

    .btn-sm { padding: 6px 11px; font-size: 0.82rem; border-radius: 8px; }
    .btn-pay { background: var(--success-bg); color: var(--success); }
    .btn-edit { background: var(--edit-bg); color: var(--edit); }
    .btn-copy { background: var(--primary-soft); color: var(--primary-text); }
    .btn-del { background: var(--danger-bg); color: var(--danger); }
    .btn-sm:hover { filter: brightness(0.95); }
    body.dark .btn-sm:hover { filter: brightness(1.15); }

    /* Cards de Resumo */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--surface);
      padding: 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .card span { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
    .card strong { font-size: 1.4rem; }
    .text-danger { color: var(--danger); }
    .text-success { color: var(--success); }

    /* Filtros */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
    }

    input[type="month"], select, input[type="text"], input[type="number"], input[type="date"], textarea {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    body.dark input[type="month"],
    body.dark input[type="date"] {
      color-scheme: dark;
    }

    textarea {
      resize: vertical;
      min-height: 68px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    /* Lista de Contas */
    .bill-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bill-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .bill-item.paid {
      opacity: 0.78;
      background: var(--surface-paid);
    }

    .bill-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 220px;
      flex: 1;
    }

    .bill-title {
      font-weight: 600;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-pending { background: var(--warning-bg); color: var(--warning); }
    .badge-overdue { background: var(--danger-bg); color: var(--danger); }
    .badge-paid { background: var(--success-bg); color: var(--success); }

    .bill-meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .bill-notes {
      font-size: 0.84rem;
      color: var(--notes-text);
      background: var(--notes-bg);
      padding: 6px 10px;
      border-radius: 8px;
      margin-top: 4px;
      border-left: 3px solid var(--primary);
      word-break: break-word;
    }

    .bill-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .bill-amount {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .bill-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      color: var(--muted);
    }

    /* Modais */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 20, 28, 0.55);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.active { display: flex; }

    .modal {
      background: var(--surface);
      width: 100%;
      max-width: 450px;
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.25);
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .modal p.subtitle {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .form-group input, .form-group select, .form-group textarea { width: 100%; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-area">
      <h1>Contas a Pagar</h1>
      <span id="syncStatus" class="sync-badge offline">Conectando...</span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-theme" id="themeToggle" onclick="toggleTheme()" title="Alternar tema claro/escuro">🌙</button>
      <button class="btn-outline" onclick="exportData()" title="Baixar cópia de segurança">Exportar</button>
      <button class="btn-outline" onclick="document.getElementById('importFile').click()">Importar</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
      <button class="btn-primary" onclick="openNewModal()">+ Novo Pagamento</button>
    </div>
  </header>

  <!-- Resumo Financeiro -->
  <section class="summary">
    <div class="card">
      <span>Total do Mês</span>
      <strong id="totalMonth">R$ 0,00</strong>
    </div>
    <div class="card">
      <span>A Pagar (Pendente)</span>
      <strong id="totalPending" class="text-danger">R$ 0,00</strong>
    </div>
    <div class="card">
      <span>Total Pago</span>
      <strong id="totalPaid" class="text-success">R$ 0,00</strong>
    </div>
  </section>

  <!-- Filtros -->
  <section class="filters">
    <div class="filter-group">
      <input type="month" id="monthFilter" onchange="render()" title="Filtrar por mês" />
      <select id="statusFilter" onchange="render()" title="Filtrar por situação">
        <option value="all">Todas as contas</option>
        <option value="pending">Pendentes</option>
        <option value="paid">Pagas</option>
      </select>
      <button type="button" class="btn-this-month" onclick="filterThisMonthPending()" title="Ver pendentes do mês atual">
        Este mês
      </button>
      <input
        type="text"
        id="searchFilter"
        class="search-input"
        placeholder="Buscar por nome ou observação..."
        oninput="render()"
      />
    </div>
  </section>

  <!-- Lista de Contas -->
  <main class="bill-list" id="billList">
    <div class="empty-state">Carregando contas da nuvem...</div>
  </main>
</div>

<!-- Modal: Novo / Editar / Copiar / Próximo Mês -->
<div class="modal-backdrop" id="formModal">
  <div class="modal">
    <h2 id="modalTitle">Novo Pagamento</h2>
    <p class="subtitle" id="modalSubtitle">Preencha os dados da conta abaixo.</p>
    <form id="billForm" onsubmit="saveBill(event)">
      <input type="hidden" id="editBillId" value="" />
      <div class="form-group">
        <label for="desc">Descrição *</label>
        <input type="text" id="desc" placeholder="Ex: Energia Elétrica, Internet, Aluguel..." required />
      </div>
      <div class="form-group">
        <label for="category">Categoria</label>
        <select id="category">
          <option value="Casa / Moradia">Casa / Moradia</option>
          <option value="Contas Fixas">Contas Fixas (Água, Luz, Net)</option>
          <option value="Cartão / Empréstimo">Cartão / Empréstimo</option>
          <option value="Veículo / Transporte">Veículo / Transporte</option>
          <option value="Outros">Outros</option>
        </select>
      </div>
      <div class="form-group">
        <label for="amount">Valor (R$) *</label>
        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00" required />
      </div>
      <div class="form-group">
        <label for="dueDate">Data de Vencimento *</label>
        <input type="date" id="dueDate" required />
      </div>
      <div class="form-group">
        <label for="notes">Observações (opcional)</label>
        <textarea id="notes" placeholder="Ex: Chave Pix, parcela 3/10, débito automático, código de barras..."></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-outline" onclick="closeModal('formModal')">Cancelar</button>
        <button type="submit" class="btn-primary" id="submitBtn">Confirmar e Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Pergunta após pagar -->
<div class="modal-backdrop" id="nextMonthPromptModal">
  <div class="modal">
    <h2>Conta marcada como paga!</h2>
    <p class="subtitle" id="promptMessage">Quer gerar um pagamento igual a este para mês que vem?</p>
    <div class="modal-footer">
      <button type="button" class="btn-outline" onclick="closeModal('nextMonthPromptModal')">Não, obrigado</button>
      <button type="button" class="btn-primary" onclick="confirmGenerateNextMonth()">Sim, gerar para mês que vem</button>
    </div>
  </div>
</div>

<!-- SDK do Firebase (Realtime Database) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // =========================================================================
  // COLE O LINK DO SEU FIREBASE ABAIXO (ex: "https://meu-app-default-rtdb.firebaseio.com")
  // =========================================================================
  const FIREBASE_DATABASE_URL = "https://controle-contas-6fa7e-default-rtdb.firebaseio.com/";

  // Controle do Tema (Claro / Escuro)
  const themeToggleBtn = document.getElementById('themeToggle');
  function applySavedTheme() {
    const savedTheme = localStorage.getItem('contas_theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
      themeToggleBtn.textContent = '☀️';
    } else {
      document.body.classList.remove('dark');
      themeToggleBtn.textContent = '🌙';
    }
  }
  applySavedTheme();

  window.toggleTheme = function() {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('contas_theme', isDark ? 'dark' : 'light');
    themeToggleBtn.textContent = isDark ? '☀️' : '🌙';
  };

  const app = initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
  const db = getDatabase(app);
  const billsRef = ref(db, 'contas');

  let bills = [];
  let lastPaidBill = null;

  const monthFilter = document.getElementById('monthFilter');
  const syncStatus = document.getElementById('syncStatus');

  function getCurrentMonthStr() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  }

  monthFilter.value = getCurrentMonthStr();

  // Escuta alterações na nuvem em tempo real
  onValue(billsRef, (snapshot) => {
    const data = snapshot.val();
    bills = data ? Object.values(data) : [];
    syncStatus.textContent = "Sincronizado";
    syncStatus.classList.remove("offline");
    render();
  }, (error) => {
    console.error(error);
    syncStatus.textContent = "Erro de conexão";
    syncStatus.classList.add("offline");
  });

  function formatCurrency(val) {
    return Number(val).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function formatDateBR(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
  }

  function escapeHTML(str) {
    return (str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function normalizeText(text) {
    return (text || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  function addOneMonth(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const nextMonthIndex = m;
    const lastDayOfNextMonth = new Date(y, nextMonthIndex + 1, 0).getDate();
    const safeDay = Math.min(d, lastDayOfNextMonth);
    const targetDate = new Date(y, nextMonthIndex, safeDay);

    const ny = targetDate.getFullYear();
    const nm = String(targetDate.getMonth() + 1).padStart(2, '0');
    const nd = String(targetDate.getDate()).padStart(2, '0');
    return `${ny}-${nm}-${nd}`;
  }

  window.filterThisMonthPending = function() {
    monthFilter.value = getCurrentMonthStr();
    document.getElementById('statusFilter').value = 'pending';
    document.getElementById('searchFilter').value = '';
    render();
  };

  window.openNewModal = function() {
    document.getElementById('editBillId').value = '';
    document.getElementById('modalTitle').textContent = 'Novo Pagamento';
    document.getElementById('modalSubtitle').textContent = 'Preencha os dados da nova conta.';
    document.getElementById('submitBtn').textContent = 'Confirmar e Salvar';
    document.getElementById('billForm').reset();

    const selectedMonth = monthFilter.value;
    const dayStr = String(new Date().getDate()).padStart(2, '0');
    document.getElementById('dueDate').value = `${selectedMonth}-${dayStr}`;

    document.getElementById('formModal').classList.add('active');
    document.getElementById('desc').focus();
  };

  window.editBill = function(id) {
    const bill = bills.find(b => b.id === id);
    if (!bill) return;

    document.getElementById('editBillId').value = bill.id;
    document.getElementById('modalTitle').textContent = 'Editar Pagamento';
    document.getElementById('modalSubtitle').textContent = 'Altere o valor, vencimento, observação ou outros dados:';
    document.getElementById('submitBtn').textContent = 'Salvar Alterações';

    document.getElementById('desc').value = bill.desc;
    document.getElementById('category').value = bill.category;
    document.getElementById('amount').value = bill.amount;
    document.getElementById('dueDate').value = bill.dueDate;
    document.getElementById('notes').value = bill.notes || '';

    document.getElementById('formModal').classList.add('active');
    document.getElementById('amount').focus();
  };

  window.copyBill = function(id) {
    const bill = bills.find(b => b.id === id);
    if (!bill) return;

    document.getElementById('editBillId').value = '';
    document.getElementById('modalTitle').textContent = 'Copiar Pagamento';
    document.getElementById('modalSubtitle').textContent = 'Confira ou ajuste os dados copiados antes de salvar.';
    document.getElementById('submitBtn').textContent = 'Confirmar e Salvar';

    document.getElementById('desc').value = bill.desc;
    document.getElementById('category').value = bill.category;
    document.getElementById('amount').value = bill.amount;
    document.getElementById('dueDate').value = bill.dueDate;
    document.getElementById('notes').value = bill.notes || '';

    document.getElementById('formModal').classList.add('active');
  };

  window.saveBill = async function(event) {
    event.preventDefault();
    const editingId = document.getElementById('editBillId').value;
    const desc = document.getElementById('desc').value.trim();
    const category = document.getElementById('category').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const dueDate = document.getElementById('dueDate').value;
    const notes = document.getElementById('notes').value.trim();

    if (editingId) {
      const existing = bills.find(b => b.id === editingId);
      const updatedBill = {
        ...existing,
        desc,
        category,
        amount,
        dueDate,
        notes
      };
      await set(ref(db, `contas/${editingId}`), updatedBill);
    } else {
      const id = Date.now().toString();
      const newBill = {
        id,
        desc,
        category,
        amount,
        dueDate,
        notes,
        paid: false,
        paidAt: null
      };
      await set(ref(db, `contas/${id}`), newBill);
    }

    closeModal('formModal');
    monthFilter.value = dueDate.slice(0, 7);
  };

  window.togglePaid = async function(id) {
    const bill = bills.find(b => b.id === id);
    if (!bill) return;

    const updatedBill = {
      ...bill,
      paid: !bill.paid,
      paidAt: !bill.paid ? new Date().toISOString().slice(0, 10) : null
    };

    await set(ref(db, `contas/${id}`), updatedBill);

    if (updatedBill.paid) {
      lastPaidBill = updatedBill;
      document.getElementById('promptMessage').textContent =
        `Você pagou "${updatedBill.desc}" (${formatCurrency(updatedBill.amount)}). Quer gerar um pagamento igual a este para mês que vem?`;
      document.getElementById('nextMonthPromptModal').classList.add('active');
    }
  };

  window.confirmGenerateNextMonth = function() {
    closeModal('nextMonthPromptModal');
    if (!lastPaidBill) return;

    document.getElementById('editBillId').value = '';
    document.getElementById('modalTitle').textContent = 'Confirmar Conta - Mês Seguinte';
    document.getElementById('modalSubtitle').textContent = 'Dados preenchidos automaticamente. Confira o valor e o vencimento:';
    document.getElementById('submitBtn').textContent = 'Confirmar e Salvar';

    document.getElementById('desc').value = lastPaidBill.desc;
    document.getElementById('category').value = lastPaidBill.category;
    document.getElementById('amount').value = lastPaidBill.amount;
    document.getElementById('dueDate').value = addOneMonth(lastPaidBill.dueDate);
    document.getElementById('notes').value = lastPaidBill.notes || '';

    document.getElementById('formModal').classList.add('active');
  };

  window.deleteBill = async function(id) {
    if (!confirm('Deseja realmente excluir esta conta?')) return;
    await remove(ref(db, `contas/${id}`));
  };

  window.closeModal = function(modalId) {
    document.getElementById(modalId).classList.remove('active');
  };

  window.render = function() {
    const selectedMonth = monthFilter.value;
    const statusFilter = document.getElementById('statusFilter').value;
    const searchQuery = normalizeText(document.getElementById('searchFilter').value.trim());
    const listEl = document.getElementById('billList');
    const todayStr = new Date().toISOString().slice(0, 10);

    const monthBills = bills
      .filter(b => b.dueDate && b.dueDate.startsWith(selectedMonth))
      .sort((a, b) => a.dueDate.localeCompare(b.dueDate));

    const total = monthBills.reduce((acc, b) => acc + Number(b.amount), 0);
    const paid = monthBills.filter(b => b.paid).reduce((acc, b) => acc + Number(b.amount), 0);
    const pending = total - paid;

    document.getElementById('totalMonth').textContent = formatCurrency(total);
    document.getElementById('totalPaid').textContent = formatCurrency(paid);
    document.getElementById('totalPending').textContent = formatCurrency(pending);

    const filteredBills = monthBills.filter(b => {
      const matchesStatus =
        statusFilter === 'pending' ? !b.paid :
        statusFilter === 'paid' ? b.paid : true;

      const matchesSearch =
        !searchQuery ||
        normalizeText(b.desc).includes(searchQuery) ||
        normalizeText(b.notes).includes(searchQuery);

      return matchesStatus && matchesSearch;
    });

    if (filteredBills.length === 0) {
      listEl.innerHTML = `<div class="empty-state">Nenhuma conta encontrada para este filtro.</div>`;
      return;
    }

    listEl.innerHTML = filteredBills.map(bill => {
      const isOverdue = !bill.paid && bill.dueDate < todayStr;
      let badgeHtml = `<span class="badge badge-pending">Pendente</span>`;
      if (bill.paid) badgeHtml = `<span class="badge badge-paid">Pago</span>`;
      else if (isOverdue) badgeHtml = `<span class="badge badge-overdue">Vencida</span>`;

      const notesHtml = bill.notes
        ? `<div class="bill-notes">${escapeHTML(bill.notes)}</div>`
        : '';

      return `
        <div class="bill-item ${bill.paid ? 'paid' : ''}">
          <div class="bill-info">
            <div class="bill-title">${escapeHTML(bill.desc)} ${badgeHtml}</div>
            <div class="bill-meta">Vencimento: <strong>${formatDateBR(bill.dueDate)}</strong> • ${escapeHTML(bill.category)}</div>
            ${notesHtml}
          </div>
          <div class="bill-right">
            <div class="bill-amount">${formatCurrency(bill.amount)}</div>
            <div class="bill-actions">
              <button class="btn-sm btn-pay" onclick="togglePaid('${bill.id}')">
                ${bill.paid ? '↩ Reabrir' : '✓ Pagar'}
              </button>
              <button class="btn-sm btn-edit" onclick="editBill('${bill.id}')" title="Editar valor, observação ou dados">
                Editar
              </button>
              <button class="btn-sm btn-copy" onclick="copyBill('${bill.id}')" title="Copiar dados desta conta">
                Copiar
              </button>
              <button class="btn-sm btn-del" onclick="deleteBill('${bill.id}')" title="Excluir">
                ✕
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  };

  window.exportData = function() {
    const blob = new Blob([JSON.stringify(bills, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup-contas-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  window.importData = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        if (Array.isArray(imported)) {
          const mapObj = {};
          imported.forEach(item => { mapObj[item.id] = item; });
          await set(billsRef, mapObj);
          alert('Backup importado para a nuvem com sucesso!');
        }
      } catch {
        alert('Arquivo inválido.');
      }
    };
    reader.readAsText(file);
  };
</script>
